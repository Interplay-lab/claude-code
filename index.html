<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Brain State Transition Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0b0a08;
    --ink-2: #11100d;
    --ink-3: #16140f;
    --line: #2a2620;
    --line-2: #3a352c;
    --bone: #e8e1d0;
    --bone-dim: #a89f8a;
    --bone-faint: #6b6557;
    --amber: #d6a657;
    --amber-bright: #f0c074;
    --amber-glow: rgba(214, 166, 87, 0.18);
    --rust: #b85a3c;
    --moss: #7a8a5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    overflow-x: hidden;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.88 0 0 0 0 0.78 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.45;
  }
  ::selection { background: var(--amber); color: var(--ink); }
  #root { position: relative; z-index: 1; }
  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes sweep {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes dash {
    to { stroke-dashoffset: -200; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo } = React;

const STATES = [
  {
    id: 'practical',
    code: 'P-01',
    name: 'Practical',
    sub: 'Logistical',
    glyph: '◧',
    descriptor: 'Sequential · Detail-oriented · Executing',
    long: 'Narrow attentional aperture. Left-lateralised. Linear chaining. Closure-seeking.',
    neural: 'DLPFC dominant. Low default-mode activity.',
    angle: 90,
  },
  {
    id: 'creative',
    code: 'C-02',
    name: 'Creative',
    sub: 'Expansive',
    glyph: '◇',
    descriptor: 'Associative · Open · Generative',
    long: 'Wide aperture. Right-hemisphere shift. Remote-associate searching. Tolerant of ambiguity.',
    neural: 'Default-mode + salience network co-active.',
    angle: 210,
  },
  {
    id: 'manager',
    code: 'M-03',
    name: 'Manager',
    sub: 'Social Architect',
    glyph: '⌬',
    descriptor: 'Relational · Systems-aware · Holding space',
    long: 'Theory-of-mind engaged. Predictive social modelling. Sustained co-regulation.',
    neural: 'TPJ + mPFC + insula coupled.',
    angle: 330,
  },
];

const byId = (id) => STATES.find(s => s.id === id);

const SYSTEM_PROMPT = `You are a specialist in cognitive state transitions — a hybrid practitioner trained in neuroscience, improv theatre, authentic relating, somatic work, lateral thinking, and attentional training. Facilitators consult you before high-stakes sessions to prepare their own nervous system.

You understand three operating modes neurologically:

PRACTICAL / LOGISTICAL — DLPFC-dominant, narrow attentional aperture, sequential chaining, closure-seeking, low default-mode activity. Body posture: forward-leaning, contracted.

CREATIVE / EXPANSIVE — wide attentional aperture, right-hemisphere shift, default-mode + salience network co-active, remote-associate searching, tolerant of ambiguity. Body posture: open, relaxed jaw, soft eyes.

MANAGER / SOCIAL ARCHITECT — TPJ + mPFC + insula coupled, theory-of-mind engaged, predictive social modelling, sustained co-regulation, multi-channel listening. Body posture: grounded, breath available, peripheral vision online.

Your task: design a warm-up sequence that takes the facilitator from their CURRENT state into the neural pathways of their DESTINATION state. Mirror the destination's signature — its attentional shape, its hemispheric bias, its body posture. Never reference the upcoming activity content directly; use it only to calibrate intensity, duration, and exercise type.

Draw from improv games (e.g. word-at-a-time, gibberish, status work), authentic relating (sentence stems, noticing practices, parallel play), somatic work (orienting, pendulation, posture priming), lateral thinking (constraint shifts, analogy chains), and attentional training (aperture switching, peripheral vision, soft focus).

Produce 2–4 exercises. Total duration under 15 minutes. Direct expert tone. No wellness language. No emoji. No "take a moment to..." softness.

Return STRICT JSON only, no markdown, no preamble. Schema:
{
  "transition_note": "1–2 sentence diagnostic of what this specific transition requires, neurologically.",
  "exercises": [
    {
      "name": "Short exercise name",
      "duration": "X min",
      "lineage": "improv | authentic relating | somatic | lateral thinking | attentional",
      "instruction": "2–4 sentences, direct, second person, specific actions.",
      "rationale": "1 sentence on why this exercise produces the destination neural signature."
    }
  ],
  "closing": "1 short sentence — the cognitive posture to carry into the session."
}`;

function Chrome({ children }) {
  return (
    <div style={{
      minHeight: '100vh',
      padding: '28px',
      display: 'flex',
      flexDirection: 'column',
      gap: 20,
      maxWidth: 1280,
      margin: '0 auto',
    }}>
      {children}
    </div>
  );
}

function Clock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const pad = (n) => String(n).padStart(2, '0');
  const utc = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
  const date = `${now.getUTCFullYear()}.${pad(now.getUTCMonth()+1)}.${pad(now.getUTCDate())}`;
  return <span>{date} · {utc}</span>;
}

function Header({ step, onReset }) {
  return (
    <header style={{
      display: 'grid',
      gridTemplateColumns: '1fr auto 1fr',
      alignItems: 'end',
      paddingBottom: 16,
      borderBottom: '1px solid var(--line)',
      gap: 24,
    }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 11, color: 'var(--bone-faint)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--amber)', boxShadow: '0 0 8px var(--amber-glow)', animation: 'pulse 2.4s ease-in-out infinite' }}></span>
          Instrument online
        </span>
        <span>Build 04 · Calibration A</span>
      </div>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 28, letterSpacing: '0.02em', lineHeight: 1.05 }}>
          Brain State Transition Console
        </div>
        <div style={{ fontSize: 10.5, letterSpacing: '0.32em', textTransform: 'uppercase', color: 'var(--bone-faint)', marginTop: 6 }}>
          A pre-session cognitive instrument
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'flex-end', fontSize: 11, color: 'var(--bone-faint)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>
        <Clock />
        <span style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
          <span>Stage {String(step).padStart(2, '0')} / 04</span>
          <button onClick={onReset} style={{
            background: 'transparent', border: '1px solid var(--line-2)', color: 'var(--bone-dim)',
            padding: '4px 10px', fontFamily: 'inherit', fontSize: 10, letterSpacing: '0.18em',
            textTransform: 'uppercase', cursor: 'pointer',
          }}>↺ Reset</button>
        </span>
      </div>
    </header>
  );
}

function FooterRail({ left, right }) {
  return (
    <footer style={{
      marginTop: 'auto',
      paddingTop: 14,
      borderTop: '1px solid var(--line)',
      display: 'flex',
      justifyContent: 'space-between',
      fontSize: 10.5,
      letterSpacing: '0.2em',
      textTransform: 'uppercase',
      color: 'var(--bone-faint)',
    }}>
      <span>{left}</span>
      <span style={{ display: 'flex', gap: 18 }}>
        <span>LAT 41.388 · LON -73.546</span>
        <span>EM-WAVE · 0.4–4 Hz</span>
        <span>{right}</span>
      </span>
    </footer>
  );
}

function StateDiagram({ current, destination, hovered, onHoverNode, onClickNode, phase }) {
  const size = 360;
  const cx = size / 2;
  const cy = size / 2;
  const r = 128;

  const nodePos = (angle) => {
    const a = (angle - 90) * Math.PI / 180;
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  };

  const transitionPath = useMemo(() => {
    if (!current || !destination) return null;
    const a = nodePos(byId(current).angle);
    const b = nodePos(byId(destination).angle);
    return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
  }, [current, destination]);

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block' }}>
      <circle cx={cx} cy={cy} r={r + 28} fill="none" stroke="var(--line)" strokeWidth="0.5" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--line-2)" strokeWidth="0.5" strokeDasharray="2 4" />
      <circle cx={cx} cy={cy} r={r - 40} fill="none" stroke="var(--line)" strokeWidth="0.5" />
      <circle cx={cx} cy={cy} r={4} fill="none" stroke="var(--bone-faint)" strokeWidth="0.5" />
      <line x1={cx} y1={cy - r - 28} x2={cx} y2={cy + r + 28} stroke="var(--line)" strokeWidth="0.5" />
      <line x1={cx - r - 28} y1={cy} x2={cx + r + 28} y2={cy} stroke="var(--line)" strokeWidth="0.5" />

      <g style={{ transformOrigin: `${cx}px ${cy}px`, animation: 'sweep 14s linear infinite' }}>
        <line x1={cx} y1={cy} x2={cx + r + 24} y2={cy}
          stroke="var(--amber)" strokeWidth="0.5" opacity="0.35" />
      </g>

      {Array.from({ length: 36 }).map((_, i) => {
        const a = (i * 10) * Math.PI / 180;
        const x1 = cx + Math.cos(a) * (r + 18);
        const y1 = cy + Math.sin(a) * (r + 18);
        const x2 = cx + Math.cos(a) * (r + 24);
        const y2 = cy + Math.sin(a) * (r + 24);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--line-2)" strokeWidth={i % 3 === 0 ? 1 : 0.5} />;
      })}

      {transitionPath && (
        <g>
          <path d={transitionPath} fill="none" stroke="var(--amber)" strokeWidth="1" opacity="0.5" strokeDasharray="3 4" style={{ animation: 'dash 6s linear infinite' }} />
          <path d={transitionPath} fill="none" stroke="var(--amber-glow)" strokeWidth="6" opacity="0.4" />
        </g>
      )}

      {STATES.map(s => {
        const { x, y } = nodePos(s.angle);
        const isCurrent = current === s.id;
        const isDest = destination === s.id;
        const isHover = hovered === s.id;
        const selectable =
          (phase === 'pick-current') ||
          (phase === 'pick-destination' && s.id !== current);
        const dim = phase === 'pick-destination' && s.id === current;
        const stroke = isCurrent ? 'var(--rust)' : isDest ? 'var(--amber)' : (isHover && selectable) ? 'var(--bone)' : 'var(--bone-faint)';
        const fill = isCurrent || isDest ? 'var(--ink-2)' : 'var(--ink)';
        return (
          <g
            key={s.id}
            transform={`translate(${x}, ${y})`}
            style={{ cursor: selectable ? 'pointer' : 'default', transition: 'opacity 200ms', opacity: dim ? 0.35 : 1 }}
            onMouseEnter={() => onHoverNode(s.id)}
            onMouseLeave={() => onHoverNode(null)}
            onClick={() => selectable && onClickNode(s.id)}
          >
            {(isCurrent || isDest) && (
              <circle r="32" fill="none" stroke={stroke} strokeWidth="0.5" opacity="0.5" />
            )}
            <circle r="22" fill={fill} stroke={stroke} strokeWidth={isCurrent || isDest ? 1.2 : 0.8} />
            <text textAnchor="middle" y="2" fontFamily="'Instrument Serif', serif" fontSize="20" fill={stroke}>
              {s.glyph}
            </text>
            <text textAnchor="middle" y="44" fontFamily="'JetBrains Mono', monospace" fontSize="9" letterSpacing="0.16em" fill="var(--bone-dim)">
              {s.code}
            </text>
            <text textAnchor="middle" y="58" fontFamily="'Instrument Serif', serif" fontSize="14" fill="var(--bone)">
              {s.name}
            </text>
            {isCurrent && (
              <text textAnchor="middle" y="-32" fontFamily="'JetBrains Mono', monospace" fontSize="8" letterSpacing="0.3em" fill="var(--rust)">FROM</text>
            )}
            {isDest && (
              <text textAnchor="middle" y="-32" fontFamily="'JetBrains Mono', monospace" fontSize="8" letterSpacing="0.3em" fill="var(--amber)">→ TO</text>
            )}
          </g>
        );
      })}

      <text x={cx} y={cy - 6} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize="8" letterSpacing="0.3em" fill="var(--bone-faint)">TRANSITION</text>
      <text x={cx} y={cy + 8} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize="8" letterSpacing="0.3em" fill="var(--bone-faint)">VECTOR</text>
    </svg>
  );
}

function PanelFrame({ label, code, children, style }) {
  return (
    <section style={{
      border: '1px solid var(--line)',
      background: 'var(--ink-2)',
      position: 'relative',
      padding: '22px 24px',
      ...style,
    }}>
      <div style={{
        position: 'absolute', top: -1, left: 16, transform: 'translateY(-50%)',
        background: 'var(--ink)', padding: '0 10px',
        fontSize: 10, letterSpacing: '0.3em', textTransform: 'uppercase', color: 'var(--bone-dim)',
      }}>
        {label}
      </div>
      {code && (
        <div style={{
          position: 'absolute', top: -1, right: 16, transform: 'translateY(-50%)',
          background: 'var(--ink)', padding: '0 10px',
          fontSize: 10, letterSpacing: '0.18em', color: 'var(--bone-faint)',
        }}>
          {code}
        </div>
      )}
      {children}
    </section>
  );
}

function StateReadout({ state, role }) {
  if (!state) {
    return (
      <div style={{ color: 'var(--bone-faint)', fontStyle: 'italic', fontFamily: "'Instrument Serif', serif", fontSize: 16 }}>
        — awaiting selection —
      </div>
    );
  }
  const accent = role === 'from' ? 'var(--rust)' : 'var(--amber)';
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 4 }}>
        <span style={{ fontFamily: "'Instrument Serif', serif", fontSize: 32, color: 'var(--bone)', lineHeight: 1 }}>
          {state.name}
        </span>
        <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontSize: 20, color: 'var(--bone-dim)' }}>
          {state.sub}
        </span>
      </div>
      <div style={{ fontSize: 10.5, letterSpacing: '0.2em', textTransform: 'uppercase', color: accent, marginBottom: 12 }}>
        {state.code} · {state.descriptor}
      </div>
      <div style={{ fontSize: 12, color: 'var(--bone-dim)', lineHeight: 1.55, marginBottom: 6 }}>{state.long}</div>
      <div style={{ fontSize: 11, color: 'var(--bone-faint)', fontStyle: 'italic', fontFamily: "'Newsreader', serif" }}>{state.neural}</div>
    </div>
  );
}

function InputStage({
  current, destination, setCurrent, setDestination,
  activity, setActivity, onGenerate, canGenerate, loading, error, hint,
  onClickNode, hovered, setHovered,
}) {
  const fromState = current ? byId(current) : null;
  const toState = destination ? byId(destination) : null;

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '380px 1fr', gap: 24, alignItems: 'start' }}>

      <PanelFrame label="Transition Diagram" code="VECTOR.MAP">
        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
          <StateDiagram
            current={current}
            destination={destination}
            hovered={hovered}
            onHoverNode={setHovered}
            onClickNode={onClickNode}
            phase={current && destination ? 'locked' : (current ? 'pick-destination' : 'pick-current')}
          />
        </div>
        <div style={{
          marginTop: 8,
          paddingTop: 10,
          borderTop: '1px solid var(--line)',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          fontSize: 10, letterSpacing: '0.18em', color: 'var(--bone-faint)',
        }}>
          <span>NODES: 3 · TRACED: {(current ? 1 : 0) + (destination ? 1 : 0)}</span>
          <span style={{ animation: 'blink 1.8s steps(2, end) infinite', color: 'var(--amber)' }}>●</span>
        </div>
      </PanelFrame>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>

        <PanelFrame label={hint} code="STAGE.STATE">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 22 }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: '0.32em', color: 'var(--rust)', textTransform: 'uppercase', marginBottom: 14 }}>
                ◀ Origin / From
              </div>
              <StateReadout state={fromState} role="from" />
            </div>
            <div style={{ borderLeft: '1px solid var(--line)', paddingLeft: 22 }}>
              <div style={{ fontSize: 10, letterSpacing: '0.32em', color: 'var(--amber)', textTransform: 'uppercase', marginBottom: 14 }}>
                Destination / To ▶
              </div>
              <StateReadout state={toState} role="to" />
            </div>
          </div>

          <div style={{ marginTop: 22, paddingTop: 18, borderTop: '1px dashed var(--line-2)' }}>
            <div style={{ fontSize: 10, letterSpacing: '0.28em', textTransform: 'uppercase', color: 'var(--bone-faint)', marginBottom: 12 }}>
              {!current ? 'Select current state →' : !destination ? 'Select destination state →' : 'Both states locked · proceed below.'}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
              {STATES.map(s => {
                const isCurrent = current === s.id;
                const isDest = destination === s.id;
                const selectable = !current ? true : (!destination ? s.id !== current : false);
                const role = isCurrent ? 'FROM' : isDest ? 'TO' : '';
                return (
                  <button
                    key={s.id}
                    onMouseEnter={() => setHovered(s.id)}
                    onMouseLeave={() => setHovered(null)}
                    onClick={() => {
                      if (!current) return setCurrent(s.id);
                      if (!destination && s.id !== current) return setDestination(s.id);
                    }}
                    style={{
                      background: isCurrent ? 'rgba(184,90,60,0.10)' : isDest ? 'var(--amber-glow)' : 'transparent',
                      border: `1px solid ${isCurrent ? 'var(--rust)' : isDest ? 'var(--amber)' : selectable ? 'var(--line-2)' : 'var(--line)'}`,
                      color: 'var(--bone)',
                      padding: '12px 12px',
                      fontFamily: 'inherit',
                      textAlign: 'left',
                      cursor: selectable ? 'pointer' : 'not-allowed',
                      opacity: !selectable && !isCurrent && !isDest ? 0.4 : 1,
                      transition: 'all 150ms',
                    }}
                  >
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                      <span style={{ fontSize: 10, letterSpacing: '0.18em', color: 'var(--bone-faint)' }}>{s.code}</span>
                      <span style={{ fontSize: 9, letterSpacing: '0.24em', color: isCurrent ? 'var(--rust)' : isDest ? 'var(--amber)' : 'transparent' }}>{role || '·'}</span>
                    </div>
                    <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 18, color: 'var(--bone)' }}>{s.name}</div>
                    <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontSize: 13, color: 'var(--bone-dim)', marginTop: 1 }}>{s.sub}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </PanelFrame>

        <PanelFrame label="Calibration Input · Upcoming Activity" code="STAGE.03">
          <div style={{ fontSize: 11, color: 'var(--bone-faint)', marginBottom: 10, letterSpacing: '0.04em' }}>
            Brief description — used only to calibrate intensity and exercise type. The activity itself will not be referenced in the warm-up.
          </div>
          <textarea
            value={activity}
            onChange={e => setActivity(e.target.value)}
            disabled={!current || !destination}
            placeholder={current && destination ? 'e.g. leading a 90-minute strategy off-site for 12 people, half remote…' : 'Locked until both states are selected.'}
            rows={3}
            style={{
              width: '100%',
              background: 'var(--ink)',
              border: '1px solid var(--line-2)',
              color: 'var(--bone)',
              fontFamily: 'inherit',
              fontSize: 13,
              padding: '12px 14px',
              resize: 'vertical',
              outline: 'none',
              caretColor: 'var(--amber)',
            }}
            onFocus={e => e.target.style.borderColor = 'var(--amber)'}
            onBlur={e => e.target.style.borderColor = 'var(--line-2)'}
          />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14 }}>
            <span style={{ fontSize: 10, letterSpacing: '0.22em', color: 'var(--bone-faint)' }}>
              {activity.trim().length} CHAR · {!current || !destination ? 'STATE LOCK PENDING' : activity.trim().length >= 4 ? 'READY' : 'AWAITING TEXT'}
            </span>
            <button
              disabled={!canGenerate || loading}
              onClick={onGenerate}
              style={{
                background: canGenerate && !loading ? 'var(--amber)' : 'transparent',
                border: `1px solid ${canGenerate && !loading ? 'var(--amber)' : 'var(--line-2)'}`,
                color: canGenerate && !loading ? 'var(--ink)' : 'var(--bone-faint)',
                padding: '12px 26px',
                fontFamily: 'inherit',
                fontSize: 11,
                letterSpacing: '0.32em',
                textTransform: 'uppercase',
                cursor: canGenerate && !loading ? 'pointer' : 'not-allowed',
                transition: 'all 180ms',
                fontWeight: 500,
              }}
            >
              {loading ? '↺ Computing…' : '▷ Generate Sequence'}
            </button>
          </div>
          {error && (
            <div style={{ marginTop: 12, padding: '10px 12px', border: '1px solid var(--rust)', color: 'var(--rust)', fontSize: 11, letterSpacing: '0.06em' }}>
              FAULT · {error}
            </div>
          )}
        </PanelFrame>

      </div>
    </div>
  );
}

function LoadingPanel({ current, destination }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setTick(x => x + 1), 220);
    return () => clearInterval(t);
  }, []);

  const lines = [
    'engaging vagal afferent baseline…',
    'sampling DLPFC activation…',
    `tracing path: ${byId(current).code} → ${byId(destination).code}`,
    'querying improv lineage corpus…',
    'querying somatic lineage corpus…',
    'querying authentic-relating corpus…',
    'calibrating intensity from activity input…',
    'composing exercise sequence…',
    'verifying sub-15min duration envelope…',
    'committing to instrument…',
  ];
  const visible = lines.slice(0, Math.min(tick + 1, lines.length));

  return (
    <PanelFrame label="Computing Transition" code="STAGE.04">
      <div style={{ display: 'grid', gridTemplateColumns: '220px 1fr', gap: 32, alignItems: 'start' }}>
        <div style={{ position: 'relative', width: 220, height: 220 }}>
          <svg width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" strokeWidth="0.5" />
            <circle cx="110" cy="110" r="75" fill="none" stroke="var(--line-2)" strokeWidth="0.5" strokeDasharray="2 5" />
            <circle cx="110" cy="110" r="50" fill="none" stroke="var(--line)" strokeWidth="0.5" />
            <g style={{ transformOrigin: '110px 110px', animation: 'sweep 3.5s linear infinite' }}>
              <line x1="110" y1="110" x2="210" y2="110" stroke="var(--amber)" strokeWidth="1" />
              <circle cx="210" cy="110" r="3" fill="var(--amber)" />
            </g>
            <text x="110" y="108" textAnchor="middle" fontFamily="'Instrument Serif', serif" fontSize="22" fill="var(--bone)">
              {byId(current).glyph} → {byId(destination).glyph}
            </text>
            <text x="110" y="128" textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize="9" letterSpacing="0.24em" fill="var(--bone-faint)">
              IN TRANSIT
            </text>
          </svg>
        </div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, lineHeight: 1.9, color: 'var(--bone-dim)' }}>
          {visible.map((l, i) => (
            <div key={i} style={{ opacity: i === visible.length - 1 ? 1 : 0.6 }}>
              <span style={{ color: 'var(--amber)', marginRight: 8 }}>›</span>{l}
            </div>
          ))}
          {visible.length < lines.length && (
            <div style={{ color: 'var(--amber)', animation: 'blink 0.6s steps(2) infinite' }}>▌</div>
          )}
        </div>
      </div>
    </PanelFrame>
  );
}

function OutputStage({ data, current, destination, activity, onReset }) {
  const total = data.exercises.reduce((acc, ex) => acc + (parseInt(ex.duration) || 0), 0);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>

      <PanelFrame label="Transition Brief" code="OUTPUT.NOTE">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: 28, alignItems: 'center', marginBottom: 22 }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: '0.28em', color: 'var(--rust)', marginBottom: 6 }}>FROM · {byId(current).code}</div>
            <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 26, color: 'var(--bone)' }}>{byId(current).name}</div>
            <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontSize: 16, color: 'var(--bone-dim)' }}>{byId(current).sub}</div>
          </div>
          <div style={{ color: 'var(--amber)', fontSize: 26, letterSpacing: '0.4em' }}>
            ──▶
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 10, letterSpacing: '0.28em', color: 'var(--amber)', marginBottom: 6 }}>TO · {byId(destination).code}</div>
            <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 26, color: 'var(--bone)' }}>{byId(destination).name}</div>
            <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontSize: 16, color: 'var(--bone-dim)' }}>{byId(destination).sub}</div>
          </div>
        </div>

        <div style={{ borderTop: '1px solid var(--line)', paddingTop: 18, display: 'grid', gridTemplateColumns: '120px 1fr', gap: 18 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.3em', color: 'var(--bone-faint)', textTransform: 'uppercase' }}>Diagnosis</div>
          <div style={{ fontFamily: "'Newsreader', serif", fontSize: 18, lineHeight: 1.5, color: 'var(--bone)', fontStyle: 'italic' }}>
            {data.transition_note}
          </div>
        </div>
      </PanelFrame>

      <PanelFrame label={`Warm-Up Sequence · ${data.exercises.length} exercises · ~${total} min`} code="OUTPUT.SEQ">
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          {data.exercises.map((ex, i) => (
            <div key={i} style={{
              display: 'grid',
              gridTemplateColumns: '70px 1fr 200px',
              gap: 24,
              padding: '22px 0',
              borderBottom: i < data.exercises.length - 1 ? '1px dashed var(--line-2)' : 'none',
            }}>
              <div>
                <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 42, color: 'var(--amber)', lineHeight: 1 }}>
                  {String(i + 1).padStart(2, '0')}
                </div>
                <div style={{ fontSize: 10, letterSpacing: '0.24em', color: 'var(--bone-faint)', marginTop: 6 }}>
                  STEP
                </div>
              </div>
              <div>
                <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: 24, color: 'var(--bone)', marginBottom: 4 }}>
                  {ex.name}
                </div>
                <div style={{ display: 'flex', gap: 14, fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--bone-faint)', marginBottom: 14 }}>
                  <span>◷ {ex.duration}</span>
                  <span>·</span>
                  <span style={{ color: 'var(--amber)' }}>{ex.lineage}</span>
                </div>
                <div style={{ fontSize: 13.5, lineHeight: 1.65, color: 'var(--bone)', maxWidth: 580 }}>
                  {ex.instruction}
                </div>
              </div>
              <div style={{ borderLeft: '1px solid var(--line)', paddingLeft: 18 }}>
                <div style={{ fontSize: 9.5, letterSpacing: '0.3em', textTransform: 'uppercase', color: 'var(--bone-faint)', marginBottom: 8 }}>
                  Rationale
                </div>
                <div style={{ fontFamily: "'Newsreader', serif", fontSize: 13, fontStyle: 'italic', lineHeight: 1.55, color: 'var(--bone-dim)' }}>
                  {ex.rationale}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ marginTop: 22, padding: '18px 20px', background: 'var(--ink-3)', border: '1px solid var(--line)' }}>
          <div style={{ fontSize: 10, letterSpacing: '0.32em', color: 'var(--amber)', textTransform: 'uppercase', marginBottom: 8 }}>
            Cognitive Posture · Carry Into Session
          </div>
          <div style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontSize: 22, color: 'var(--bone)', lineHeight: 1.4 }}>
            “{data.closing}”
          </div>
        </div>
      </PanelFrame>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontSize: 10.5, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--bone-faint)' }}>
          Calibration source · {activity.trim().slice(0, 70)}{activity.length > 70 ? '…' : ''}
        </div>
        <button
          onClick={onReset}
          style={{
            background: 'transparent',
            border: '1px solid var(--bone-dim)',
            color: 'var(--bone)',
            padding: '12px 24px',
            fontFamily: 'inherit',
            fontSize: 11,
            letterSpacing: '0.32em',
            textTransform: 'uppercase',
            cursor: 'pointer',
          }}
        >
          ↺ New Transition
        </button>
      </div>
    </div>
  );
}

function App() {
  const [current, setCurrent] = useState(null);
  const [destination, setDestination] = useState(null);
  const [activity, setActivity] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [output, setOutput] = useState(null);
  const [hovered, setHovered] = useState(null);

  const step = output ? 4 : loading ? 3 : (current && destination) ? 3 : current ? 2 : 1;
  const hint =
    !current ? 'Stage 01 · Identify Current State'
    : !destination ? 'Stage 02 · Identify Destination State'
    : 'Stages 01–02 · Locked';

  const canGenerate = !!(current && destination && activity.trim().length >= 4);

  const reset = () => {
    setCurrent(null);
    setDestination(null);
    setActivity('');
    setOutput(null);
    setError(null);
    setLoading(false);
  };

  const handleClickNode = (id) => {
    if (!current) return setCurrent(id);
    if (!destination && id !== current) return setDestination(id);
  };

  const generate = async () => {
    setLoading(true);
    setError(null);
    setOutput(null);
    try {
      const from = byId(current);
      const to = byId(destination);
      const userMsg = `CURRENT STATE: ${from.name} / ${from.sub} (${from.descriptor})
DESTINATION STATE: ${to.name} / ${to.sub} (${to.descriptor})
UPCOMING ACTIVITY (calibration only — do not reference content): ${activity.trim()}

Design the warm-up sequence. Return JSON only per the schema.`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const json = await res.json();
      const text = (json.content && json.content[0] && json.content[0].text) || '';
      const cleaned = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
      let parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (e) {
        const match = cleaned.match(/\{[\s\S]*\}/);
        if (!match) throw new Error('Malformed response — could not parse JSON.');
        parsed = JSON.parse(match[0]);
      }
      if (!parsed.exercises || !Array.isArray(parsed.exercises)) {
        throw new Error('Response missing exercises.');
      }
      setOutput(parsed);
    } catch (e) {
      setError(e.message || 'Unknown error.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <Chrome>
      <Header step={step} onReset={reset} />

      {!output && !loading && (
        <InputStage
          current={current}
          destination={destination}
          setCurrent={setCurrent}
          setDestination={setDestination}
          activity={activity}
          setActivity={setActivity}
          onGenerate={generate}
          canGenerate={canGenerate}
          loading={loading}
          error={error}
          hint={hint}
          onClickNode={handleClickNode}
          hovered={hovered}
          setHovered={setHovered}
        />
      )}

      {loading && (
        <LoadingPanel current={current} destination={destination} />
      )}

      {output && !loading && (
        <OutputStage
          data={output}
          current={current}
          destination={destination}
          activity={activity}
          onReset={reset}
        />
      )}

      <FooterRail
        left={
          output ? 'Sequence committed · Awaiting next transition.'
          : loading ? 'Working — do not unseat the instrument.'
          : `Specimen ID · TX-${(Date.now() % 90000 + 10000)}`
        }
        right="◬ INSTRUMENT v0.4"
      />
    </Chrome>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
